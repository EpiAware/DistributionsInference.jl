name = "DistributionsInference"
uuid = "205dfa0f-445e-4692-a651-ee32c3bca9ae"
authors = ["Sam Abbott", "EpiAware contributors"]
version = "0.1.0"

[deps]
Distributions = "31c24e10-a181-5473-b8eb-7969acd0382f"
DocStringExtensions = "ffbed154-4ef7-542d-bbb7-c09d3a79fcae"
EpiAwareADTools = "908e2895-a690-4874-a954-ca006cb9734d"
LogDensityProblems = "6fdf6af0-433a-55f7-b3ed-c6c6e0b8df7c"
LogExpFunctions = "2ab3a3ac-af41-5b50-aa03-7779005ae688"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"

[weakdeps]
Bijectors = "76274a88-744f-5084-9051-94815aaf08c4"
ComposedDistributions = "2f642b71-32a9-4f47-97c4-6deb7517f7a7"
DynamicPPL = "366bfd00-2699-11ea-058f-f148b4cae6d8"
FlexiChains = "4a37a8b9-6e57-4b92-8664-298d46e639f7"
Mooncake = "da2b9cff-9c12-43a0-ae48-6db2b0edb7d6"
Optim = "429524aa-4258-5aef-a3af-852621145aeb"

[extensions]
DistributionsInferenceBijectorsExt = "Bijectors"
DistributionsInferenceComposedDistributionsExt = "ComposedDistributions"
DistributionsInferenceDynamicPPLExt = "DynamicPPL"
DistributionsInferenceDynamicPPLFlexiChainsExt = ["DynamicPPL", "FlexiChains"]
DistributionsInferenceFlexiChainsExt = "FlexiChains"
DistributionsInferenceMooncakeExt = "Mooncake"
DistributionsInferenceOptimExt = "Optim"

[compat]
Bijectors = "0.13, 0.14, 0.15, 0.16"
ComposedDistributions = "0.1, 0.2"
# Floored at 0.25.117: DynamicPPL's `debug_utils.jl` references
# `Distributions.ProductNamedTupleDistribution`, added in that release. An
# unbounded "0.25" lets `downgrade-compat` resolve an older Distributions
# that DynamicPPL/Bijectors then fail to precompile against.
Distributions = "0.25.117"
DocStringExtensions = "0.9"
DynamicPPL = "0.40, 0.41, 0.42"
# Floored at 0.1.3: the release that hosts the shared `xlogy`/`xlog1py`
# Mooncake rules this package used to carry itself (#73). No environment here
# resolves until 0.1.3 is in General, so this branch must not merge before that
# release.
EpiAwareADTools = "0.1.2"
FlexiChains = "0.4, 0.5, 0.6"
LogDensityProblems = "2"
LogExpFunctions = "0.3, 1"
Mooncake = "0.5"
# Kept in step with test/Project.toml so the merged downgrade resolve agrees
# on one floor for the two environments.
Optim = "2.2"
Statistics = "1"
julia = "1.11"

[workspace]
projects = ["test"]
