# MANAGED by EpiAwarePackageTools.scaffold — do not edit by hand.
name: Test

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: EpiAware/.github/.github/workflows/tests.yml@6fcdcde033ec670ac3832b239427fd2ded591bbc
    with:
      # The managed standard needs Julia 1.11: `[sources]` (how test/Project.toml
      # pins the kit to main) is a Pkg 1.11 feature, and on 1.10 it is silently
      # ignored — the job then resolves the registered kit rather than the
      # pinned rev and tests a stale kit while appearing to test this one
      # (#246). The reusable defaults to ["1", "lts", "pre"]; drop the lts leg.
      julia_versions: '["1", "pre"]'
    secrets: inherit  # pragma: allowlist secret

  downgrade-compat:
    # Package-owned deviation: this points at a local copy of the reusable
    # rather than EpiAware/.github's `downgrade.yml`. The shared reusable calls
    # `julia-actions/julia-downgrade-compat` without a `projects` input, so it
    # floor-resolves the root project alone — which cannot work here, because
    # the test environment is a workspace member sharing the root manifest, and
    # its unregistered `[sources]` deps then go missing from that manifest. The
    # reusable exposes no `projects` input, so the fix cannot be passed from
    # this caller; see `.github/workflows/downgrade.yaml` for the full write-up
    # and for when to switch back.
    uses: ./.github/workflows/downgrade.yaml
    with:
      julia_version: '1'
      projects: '., test'
    secrets: inherit  # pragma: allowlist secret
