# PACKAGE-OWNED — a local stand-in for EpiAware/.github's `downgrade.yml`.
#
# The shared reusable exposes no `projects` input, so the action resolves the
# root project alone. The test environment is a workspace member, so that
# resolve never sees `test/Project.toml` and writes a manifest the tests cannot
# be instantiated from. Passing `projects: '., test'` selects the action's
# merged-resolution path instead. Everything else mirrors the reusable; once
# `EpiAware/.github/.github/workflows/downgrade.yml` gains a `projects` input,
# delete this file and point `test.yaml`'s `downgrade-compat` job back at it.

name: Downgrade

on:
  workflow_call:
    inputs:
      julia_version:
        description: 'Julia version to run the downgrade suite on'
        required: false
        type: string
        default: '1.10'
      mode:
        description: 'julia-downgrade-compat mode (deps, alldeps, ...)'
        required: false
        type: string
        default: 'deps'
      projects:
        description: >-
          Comma-separated Julia projects to resolve. Defaults to the root and
          the test environment so the workspace member is part of the resolve.
        required: false
        type: string
        default: '., test'
      test_args:
        description: 'Extra args passed to julia-runtest test_args'
        required: false
        type: string
        default: 'skip_quality'

jobs:
  downgrade-compat:
    name: Downgrade Compat
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ inputs.julia_version }}
      # `julia-downgrade-compat` handles a `[sources]` **path** entry (its
      # compat joins the floor resolve and it is written back to the manifest)
      # but not a **url** entry, which is stripped before the resolve and never
      # restored — and restoring it afterwards is no fix, since the floors are
      # frozen by then and any clash is unresolvable. So clone each url-pinned
      # source at the rev `[sources]` names, into the runner temp dir, and
      # rewrite the entry to a path. Nothing is url-pinned today; kept as a
      # guard for the next unregistered dependency.
      - name: Vendor the url-pinned sources as path sources
        shell: bash
        env:
          VENDOR_DIR: ${{ runner.temp }}/downgrade-sources
        run: |
          set -euo pipefail
          mkdir -p "$VENDOR_DIR"
          cat > "$RUNNER_TEMP/vendor_sources.jl" <<'JULIA'
          using TOML

          vendor = ENV["VENDOR_DIR"]
          file = "test/Project.toml"
          project = TOML.parsefile(file)
          sources = get(project, "sources", Dict{String, Any}())
          vendored = String[]

          for name in sort!(collect(keys(sources)))
              spec = sources[name]
              (spec isa AbstractDict && haskey(spec, "url")) || continue
              rev = get(spec, "rev", "main")
              dest = joinpath(vendor, name)
              run(`git clone --quiet --depth 1 --branch $rev $(spec["url"]) $dest`)
              sources[name] = Dict{String, Any}(
                  "path" => relpath(dest, dirname(abspath(file)))
              )
              push!(vendored, name)
              @info "Vendored $name" url=spec["url"] rev dest
          end

          if isempty(vendored)
              @info "No url-pinned sources found; nothing to vendor"
          else
              open(file, "w") do io
                  TOML.print(io, project; sorted = true)
              end
              @info "Rewrote $file [sources] to local paths" vendored
          end
          JULIA
          julia --color=yes "$RUNNER_TEMP/vendor_sources.jl"
      - uses: julia-actions/julia-downgrade-compat@v2
        with:
          mode: ${{ inputs.mode }}
          projects: ${{ inputs.projects }}
      - uses: julia-actions/cache@v3
      # `test` is a workspace member, so the root manifest is the only one Pkg
      # reads; the action's `test/Manifest.toml` can only go stale.
      - name: Drop the stray member manifest
        shell: bash
        run: rm -f test/Manifest.toml
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          test_args: ${{ inputs.test_args }}
      # Runs after the tests so the floors land at the end of a red log rather
      # than thousands of lines up. Reporting only, never changes the result.
      - name: Report the resolved floors
        if: always()
        shell: bash
        run: julia --color=yes --project=test -e 'using Pkg; Pkg.status()' || true
