# PACKAGE-OWNED — scaffold writes this once and never overwrites it.
#
# The documentation environment; the package is pinned by path via `[sources]`.
#
# The ad-backends tutorial's plotting stack (AlgebraOfGraphics/CairoMakie/
# DataFramesMeta) is absent so this env instantiates: `AlgebraOfGraphics` caps
# `DimensionalData` at 0.28.3 while the `FlexiChains` these docs load needs
# >=0.29.24 (kit#283). Restore those deps, and `docs` as a workspace member,
# once that ceiling lifts.
[deps]
ADFixtures = "51837e51-2e8d-4c65-a757-038da73554aa"
Bijectors = "76274a88-744f-5084-9051-94815aaf08c4"
ComposedDistributions = "2f642b71-32a9-4f47-97c4-6deb7517f7a7"
DifferentiationInterfaceTest = "a82114a7-5aa3-49a8-9643-716bb13727a3"
Distributions = "31c24e10-a181-5473-b8eb-7969acd0382f"
DynamicPPL = "366bfd00-2699-11ea-058f-f148b4cae6d8"
FlexiChains = "4a37a8b9-6e57-4b92-8664-298d46e639f7"
Markdown = "d6f4376e-aef5-505a-96c1-9c027394607a"
Mooncake = "da2b9cff-9c12-43a0-ae48-6db2b0edb7d6"
Optim = "429524aa-4258-5aef-a3af-852621145aeb"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
Turing = "fce5fe82-541a-59a6-adf8-730c64b5f9a0"
Documenter = "e30172f5-a6a5-5a46-863b-614d45cd2de4"
DocumenterCitations = "daee34ce-89f3-4625-b898-19384cb65244"
DocumenterVitepress = "4710194d-e776-4893-9690-8d956a29c365"
EpiAwarePackageTools = "7aaea248-0d11-4a0d-a7dc-86da30abb951"
Literate = "98b081ad-f1c9-55d3-8b20-4c87d4299306"
DistributionsInference = "205dfa0f-445e-4692-a651-ee32c3bca9ae"

[sources]
DistributionsInference = {path = ".."}
ADFixtures = {path = "../test/ADFixtures"}

[compat]
Bijectors = "0.13, 0.14, 0.15, 0.16"
ComposedDistributions = "0.1, 0.2"
DifferentiationInterfaceTest = "0.9, 0.10"
Distributions = "0.25"
# 0.39 fails to precompile on Julia 1.12 (its EnzymeCore extension errors).
DynamicPPL = "0.40, 0.41, 0.42"
FlexiChains = "0.4, 0.5, 0.6"
Markdown = "1"
# Mooncake is a direct dep because the `ADFixtures` registry deliberately does
# not depend on it (its Mooncake rules clash with ComposedDistributions' —
# DI#73), so it no longer arrives transitively. This makes Mooncake AVAILABLE
# in the docs environment; it does not make the AD-backends page able to run
# its Mooncake rows, because the kit-managed page has no `using Mooncake` and
# a `[deps]` entry only installs a package rather than loading it. See the
# `FORCE_STUB_TUTORIALS` note in docs/docs_config.jl.
Mooncake = "0.5"
Optim = "1"
Random = "1"
Statistics = "1"
Turing = "0.42, 0.43, 0.44, 0.45"
Documenter = "1"
DocumenterCitations = "1"
DocumenterVitepress = "0.3"
EpiAwarePackageTools = "0.2"
Literate = "2"
